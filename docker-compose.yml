services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
      POSTGRES_DB: fleetpulse_fleet
    ports:
      # bound to loopback only - Docker's default "5432:5432" publishes on
      # every host interface, including a public one if the host has no NAT
      # in front of it, which is exactly how this got flagged as an open,
      # unauthenticated service reachable from the internet
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # a fixed, valid cluster ID rather than generating one at runtime, so
      # `docker compose up` just works with no extra setup step first
      CLUSTER_ID: 7MdXSiQ_RsywjDOlo2UbvQ
    ports:
      - "127.0.0.1:9092:9092"

  redis:
    image: redis:7-alpine
    ports:
      # see the note on postgres above - Redis has no auth configured at
      # all by default, so an unrestricted publish here means anyone on the
      # internet gets full read/write access to it
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
