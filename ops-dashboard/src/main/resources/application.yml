server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: ops-dashboard

vaadin:
  launch-browser: false

fleetpulse:
  services:
    # all three now go through gateway-service instead of each service's own
    # port directly, that's the whole point of having a gateway
    fleet-service-url: ${FLEET_SERVICE_URL:http://localhost:8080}
    health-engine-url: ${HEALTH_ENGINE_URL:http://localhost:8080}
    alert-service-url: ${ALERT_SERVICE_URL:http://localhost:8080}
