server:
  port: 8081

spring:
  application:
    name: fleet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetpulse_fleet}
    username: ${DB_USER:fleetpulse}
    password: ${DB_PASSWORD:fleetpulse}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

security:
  jwt:
    # dev-only fallback, real deployments must set JWT_SECRET
    secret: ${JWT_SECRET:this-is-a-dev-only-jwt-signing-secret-do-not-use-in-prod-00000}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
