server:
  port: 8081

spring:
  application:
    name: fleet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetpulse_fleet}
    username: ${DB_USER:fleetpulse}
    password: ${DB_PASSWORD:fleetpulse}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
