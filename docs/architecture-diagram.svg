<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="760" viewBox="0 0 2100 760" role="img" aria-labelledby="title desc">
<title id="title">FleetPulse System Architecture</title>
<desc id="desc">Professional block diagram showing Ops Dashboard, Gateway Service, Fleet Service, Vehicle Simulator, Telemetry Service, Health Engine, Alert Service, Maintenance Service, and Kafka event bus.</desc>

<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0F2742" flood-opacity="0.08"/>
  </filter>

  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#1E5F97"/>
  </marker>

  <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#6B7788"/>
  </marker>

  <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#D96B1B"/>
  </marker>

  <style>
    .bg { fill:#FFFFFF; }
    .card { fill:#FFFFFF; stroke:#2E5D7B; stroke-width:2; rx:16; filter:url(#shadow); }
    .external { fill:#FFFFFF; stroke:#2E5D7B; stroke-width:2; stroke-dasharray:9 7; rx:16; }
    .title { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:24px; font-weight:700; fill:#0E243D; }
    .subtitle { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:15px; font-weight:400; fill:#607085; }
    .small { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:14px; fill:#607085; }
    .line-label { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:15px; font-weight:600; fill:#314D69; }
    .orange-label { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:14px; font-weight:700; fill:#C45F16; }
    .section { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:12px; font-weight:700; letter-spacing:1.8px; fill:#8A97A8; }
    .legend { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:14px; fill:#425466; }
    .bus-title { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:26px; font-weight:700; fill:#FFFFFF; }
    .bus-sub { font-family:Inter,Segoe UI,Arial,sans-serif; font-size:15px; fill:#FFF4E9; }
    .icon-stroke { fill:none; stroke:#24557A; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .icon-fill { fill:#24557A; }
  </style>
</defs>

<rect class="bg" x="0" y="0" width="2100" height="760"/>

<!-- Section labels -->
<text class="section" x="50" y="35">CONTROL &amp; API LAYER</text>
<text class="section" x="50" y="250">PROCESSING SERVICES</text>
<text class="section" x="50" y="525">EVENT STREAMING</text>

<!-- Top row cards -->
<rect class="card" x="55" y="60" width="420" height="115"/>
<g transform="translate(92 88)">
  <rect x="0" y="0" width="54" height="40" rx="4" class="icon-stroke"/>
  <line x1="27" y1="40" x2="27" y2="51" class="icon-stroke"/>
  <line x1="14" y1="51" x2="40" y2="51" class="icon-stroke"/>
  <rect x="10" y="22" width="6" height="11" class="icon-fill"/>
  <rect x="23" y="13" width="6" height="20" class="icon-fill"/>
  <rect x="36" y="18" width="6" height="15" class="icon-fill"/>
</g>
<text class="title" x="175" y="108">Ops Dashboard</text>
<text class="subtitle" x="175" y="136">Web application</text>

<rect class="card" x="660" y="60" width="430" height="115"/>
<g transform="translate(700 88)">
  <path d="M28 0 L55 14 L55 43 L28 57 L1 43 L1 14 Z" fill="#E9F2FF" stroke="#2F6FDB" stroke-width="2"/>
  <path d="M15 29 H41 M35 21 L43 29 L35 37" fill="none" stroke="#2F6FDB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="title" x="790" y="108">Gateway Service</text>
<text class="subtitle" x="790" y="136">API gateway</text>

<rect class="card" x="1245" y="60" width="420" height="115"/>
<g transform="translate(1285 85)">
  <ellipse cx="28" cy="10" rx="28" ry="10" class="icon-stroke"/>
  <path d="M0 10 V45 C0 51 13 56 28 56 C43 56 56 51 56 45 V10" class="icon-stroke"/>
  <path d="M0 27 C0 33 13 38 28 38 C43 38 56 33 56 27" class="icon-stroke"/>
</g>
<text class="title" x="1372" y="108">Fleet Service</text>
<text class="subtitle" x="1372" y="136">Fleet management</text>

<!-- Top row connections -->
<line x1="475" y1="118" x2="648" y2="118" stroke="#1E5F97" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="line-label" x="513" y="92">REST + JWT</text>

<line x1="1090" y1="118" x2="1233" y2="118" stroke="#1E5F97" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="line-label" x="1136" y="92">auth</text>

<!-- Lower row cards -->
<rect class="external" x="55" y="305" width="365" height="125"/>
<g transform="translate(85 342)">
  <path d="M8 28 L18 8 H50 L62 28 Z" class="icon-stroke"/>
  <rect x="4" y="28" width="62" height="20" rx="6" class="icon-stroke"/>
  <circle cx="17" cy="49" r="7" class="icon-fill"/>
  <circle cx="54" cy="49" r="7" class="icon-fill"/>
</g>
<text class="title" x="175" y="351">Vehicle Simulator</text>
<text class="subtitle" x="175" y="378">Simulated fleet / test source</text>

<rect class="card" x="555" y="305" width="365" height="125"/>
<g transform="translate(590 340)">
  <circle cx="30" cy="28" r="6" class="icon-fill"/>
  <line x1="30" y1="34" x2="30" y2="55" class="icon-stroke"/>
  <path d="M15 20 C6 29 6 39 15 48" class="icon-stroke"/>
  <path d="M45 20 C54 29 54 39 45 48" class="icon-stroke"/>
  <path d="M8 13 C-5 27 -5 41 8 56" class="icon-stroke"/>
  <path d="M52 13 C65 27 65 41 52 56" class="icon-stroke"/>
</g>
<text class="title" x="675" y="351">Telemetry Service</text>
<text class="subtitle" x="675" y="378">Vehicle data processing</text>

<rect class="card" x="970" y="305" width="365" height="125"/>
<g transform="translate(1008 337)">
  <path d="M28 56 C8 39 0 27 0 17 C0 7 8 0 18 0 C24 0 30 3 34 9 C38 3 44 0 50 0 C60 0 68 7 68 17 C68 27 60 39 40 56 L34 61 Z" fill="#24557A"/>
  <polyline points="10,30 23,30 30,20 37,40 44,27 58,27" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="title" x="1095" y="351">Health Engine</text>
<text class="subtitle" x="1095" y="378">Vehicle health &amp; diagnostics</text>

<rect class="card" x="1385" y="305" width="365" height="125"/>
<g transform="translate(1420 338)">
  <path d="M28 0 C17 0 9 9 9 21 V34 L2 42 H54 L47 34 V21 C47 9 39 0 28 0 Z" class="icon-fill"/>
  <circle cx="28" cy="48" r="5" class="icon-fill"/>
</g>
<text class="title" x="1505" y="351">Alert Service</text>
<text class="subtitle" x="1505" y="378">Alerting &amp; notifications</text>

<rect class="card" x="1780" y="305" width="265" height="125"/>
<g transform="translate(1808 338)">
  <path d="M46 4 C39 0 31 0 25 4 L37 16 L26 27 L14 15 C10 21 10 29 14 36 L0 50 L9 59 L23 45 C30 49 38 49 44 45 C52 40 56 31 54 23 L43 34 L32 23 Z" class="icon-fill"/>
</g>
<text class="title" x="1880" y="349">Maintenance</text>
<text class="subtitle" x="1880" y="377">Service &amp; workflows</text>

<!-- Vehicle Simulator -> Telemetry -->
<line x1="420" y1="368" x2="543" y2="368" stroke="#6B7788" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-gray)"/>
<text class="line-label" x="456" y="345">gRPC</text>

<!-- Gateway routes to lower services (NO gateway-to-telemetry line) -->
<text class="small" x="850" y="214">routes REST requests to</text>

<path d="M875 175 C915 225 980 245 1118 295" fill="none" stroke="#1E5F97" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
<path d="M875 175 C1030 218 1240 240 1530 295" fill="none" stroke="#1E5F97" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
<path d="M875 175 C1160 215 1540 235 1910 295" fill="none" stroke="#1E5F97" stroke-width="2.4" marker-end="url(#arrow-blue)"/>

<!-- Kafka bus -->
<rect x="510" y="575" width="1535" height="105" rx="26" fill="#B96024"/>
<g transform="translate(1120 596)">
  <circle cx="0" cy="0" r="7" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="0" cy="25" r="7" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="0" cy="50" r="7" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="28" cy="25" r="7" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="7" y1="4" x2="22" y2="21" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="7" y1="25" x2="21" y2="25" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="7" y1="46" x2="22" y2="29" stroke="#FFFFFF" stroke-width="3"/>
</g>
<text class="bus-title" x="1185" y="620">KAFKA — Event Bus</text>
<text class="bus-sub" x="1185" y="649">Decoupled event-driven communication</text>

<!-- Telemetry publishes -->
<line x1="738" y1="430" x2="738" y2="563" stroke="#D96B1B" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
<text class="orange-label" x="665" y="500">telemetry.raw</text>

<!-- Health consumes telemetry.raw -->
<line x1="1088" y1="563" x2="1088" y2="442" stroke="#D96B1B" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
<text class="orange-label" x="995" y="494">consume: telemetry.raw</text>

<!-- Health publishes health.alerts -->
<line x1="1218" y1="442" x2="1218" y2="563" stroke="#D96B1B" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
<text class="orange-label" x="1142" y="528">publish: health.alerts</text>

<!-- Alert consumes -->
<line x1="1568" y1="563" x2="1568" y2="442" stroke="#D96B1B" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
<text class="orange-label" x="1495" y="494">health.alerts</text>

<!-- Maintenance consumes -->
<line x1="1912" y1="563" x2="1912" y2="442" stroke="#D96B1B" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
<text class="orange-label" x="1838" y="494">health.alerts</text>

<!-- Legend -->
<g transform="translate(55 585)">
  <line x1="0" y1="0" x2="95" y2="0" stroke="#1E5F97" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text class="legend" x="115" y="5">Synchronous communication (REST / gRPC)</text>

  <line x1="0" y1="34" x2="95" y2="34" stroke="#D96B1B" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text class="legend" x="115" y="39">Asynchronous events (Kafka topics)</text>

  <line x1="0" y1="68" x2="95" y2="68" stroke="#6B7788" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-gray)"/>
  <text class="legend" x="115" y="73">External / test source</text>
</g>

<!-- Footer -->
<text class="small" x="55" y="730">FleetPulse system architecture • editable vector SVG</text>
</svg>