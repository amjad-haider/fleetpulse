server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: fleet-service-auth
          uri: ${FLEET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: fleet-service
          uri: ${FLEET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/vehicles/**
        - id: health-engine
          uri: ${HEALTH_ENGINE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/health-scores/**
        - id: alert-service
          uri: ${ALERT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/alerts/**

security:
  jwt:
    # must match fleet-service's secret, it's the one issuing the tokens
    secret: ${JWT_SECRET:this-is-a-dev-only-jwt-signing-secret-do-not-use-in-prod-00000}
